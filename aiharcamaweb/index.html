<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>AI Harcama Asistanı</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="container">

  <div class="left-panel">
    <h1>💸 AI Harcama Asistanı</h1>
    <p>Alışverişten önce bir kez düşün.</p>

    <div class="glass-card">
      <label>Sepet Tutarı</label>
      <input type="number" id="fiyatInput" placeholder="Örn: 1250">

      <button id="analizEtButon">AI ile Analiz Et</button>

      <div id="loading"></div>

      <div id="riskKutusu" class="risk-box" style="display:none;">
        <div class="risk-label">Risk Seviyesi</div>
        <div class="risk-bar">
          <div id="riskBarFill"></div>
        </div>
        <div id="riskText"></div>
      </div>
    </div>

    <div class="footer-note">
      📈 Daha bilinçli harca, daha güçlü birikim yap.
    </div>
  </div>

  <div class="right-panel">
    <div class="chat-box">
  <h2>🤖 AI Sohbet</h2>

  <div id="sonuc" class="chat-content">
    <div class="chat-ai">Merhaba! Sepetindeki ürünleri veya harcamanı anlat, birlikte değerlendirelim.</div>
  </div>

  <div class="chat-input-area">
    <input type="text" id="chatInput" placeholder="Örn: Sepetimde ayakkabı ve kulaklık var..." />
    <button id="chatGonder">Gönder</button>
  </div>
  </div>
  </div>

</div>

<script src="script.js"></script>
</body>
</html>
